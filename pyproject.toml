[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-profile"
version = "0.1.0"
description = "Thin local launcher for the cc-profile router"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
ccp = "cc_profile:main"
cc-profile = "cc_profile:main"

[tool.setuptools]
py-modules = ["cc_profile"]
