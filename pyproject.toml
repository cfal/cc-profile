[project]
name = "cc-profile"
version = "0.1.0"
description = "Switch Claude Code and Codex config-dir profiles"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ccp = "cc_profile:main"
cc-profile = "cc_profile:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["cc_profile.py"]
